name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # typecheck (src + tests) + lint + format check + unit tests,
      # then type-aware lint, build, and package checks (attw + publint)
      - run: npm run verify

      - name: Smoke-run the built CLI
        run: |
          node dist/cli.js --version
          node dist/cli.js --help
          node dist/cli.js send --help
          node dist/cli.js check --help

      - name: Check exit codes and diagnostics of the built CLI
        run: |
          # a usage error is exit 2 with one diagnostic line on stderr
          code=0; node dist/cli.js < /dev/null 2> usage.err || code=$?
          [ "$code" -eq 2 ] || { echo "expected exit 2, got $code"; exit 1; }
          [ "$(wc -l < usage.err)" -eq 1 ] || { echo "expected one diagnostic line"; cat usage.err; exit 1; }
          grep -q '^dwh: error dwh(usage): ' usage.err
          # a missing configuration is exit 1, for send and for check alike
          code=0; node dist/cli.js README.md 2> config.err || code=$?
          [ "$code" -eq 1 ] || { echo "expected exit 1, got $code"; exit 1; }
          grep -q '^dwh: error dwh(not-configured): ' config.err
          code=0; node dist/cli.js check --json > check.json || code=$?
          [ "$code" -eq 1 ] || { echo "expected exit 1, got $code"; exit 1; }
          node -e "const r = JSON.parse(require('fs').readFileSync('check.json', 'utf8')); if (r.ok !== false || r.diagnostics[0].code !== 'not-configured') { process.exit(1); }"
          # a dry run never touches the network and reports the plan
          DWH_WEBHOOK_URL=https://discord.com/api/webhooks/1/token node dist/cli.js README.md --dry-run | grep -q '^would send README.md '

      - name: Hidden destination never names the destination
        run: |
          {
            DWH_HIDE_DESTINATION=1 node dist/cli.js --help
            DWH_HIDE_DESTINATION=1 node dist/cli.js send --help
            DWH_HIDE_DESTINATION=1 node dist/cli.js check --help
            DWH_HIDE_DESTINATION=1 node dist/cli.js check 2>&1 || true
            DWH_HIDE_DESTINATION=1 node dist/cli.js README.md 2>&1 || true
            DWH_HIDE_DESTINATION=1 DWH_WEBHOOK_URL=not-a-url node dist/cli.js README.md --json 2>&1 || true
          } > hidden.out
          if grep -qi 'discord\|webhook' hidden.out; then echo "hidden mode leaked:"; cat hidden.out; exit 1; fi

      - name: Install the packed tarball into a scratch consumer
        run: |
          npm pack
          CONSUMER="$(mktemp -d)"
          cp kongyo2-dwh-*.tgz "$CONSUMER/"
          cd "$CONSUMER"
          npm init -y > /dev/null
          npm install ./kongyo2-dwh-*.tgz
          node --input-type=module -e "import { sendFiles, resolveInputs } from '@kongyo2/dwh'; if (typeof sendFiles !== 'function' || typeof resolveInputs !== 'function') { throw new Error('unexpected exports'); } console.log('library import ok');"
          ./node_modules/.bin/dwh --version
