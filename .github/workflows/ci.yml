name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # typecheck (src + tests) + lint + format check + unit tests,
      # then type-aware lint, build, and package checks (attw + publint)
      - run: npm run verify

      - name: Smoke-run the built CLI
        run: |
          node dist/cli.js --version
          node dist/cli.js --help

      - name: Install the packed tarball into a scratch consumer
        run: |
          npm pack
          CONSUMER="$(mktemp -d)"
          cp kongyo2-dwh-*.tgz "$CONSUMER/"
          cd "$CONSUMER"
          npm init -y > /dev/null
          npm install ./kongyo2-dwh-*.tgz
          node --input-type=module -e "import { sendFiles, resolveInputs } from '@kongyo2/dwh'; if (typeof sendFiles !== 'function' || typeof resolveInputs !== 'function') { throw new Error('unexpected exports'); } console.log('library import ok');"
          ./node_modules/.bin/dwh --version
